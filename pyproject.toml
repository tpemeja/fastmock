[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastmock"
version = "0.1.1"
description = "FastAPI middleware for mocking responses based on Pydantic models response"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tanguy PEMEJA", email = "tanguy.pemeja@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2",
    "fastapi",
    "polyfactory",
]

[project.urls]
Homepage = "https://github.com/tpemeja/fastmock"
Documentation = "https://tpemeja.github.io/fastmock"
Repository = "https://github.com/tpemeja/fastmock"

[dependency-groups]
test = [
    "pydantic[email]",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "coverage",
    "coveralls",
    "httpx",
]
lint = [
    "pylint",
]
docs = [
    "mkdocs",
    "mkdocs-material",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.hatch.build.targets.wheel]
packages = ["fastmock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fastmock"]
